description: Implement a task, review it, and address findings until the work is ready to finish.
start: implement
steps:
  implement:
    instruction: steps/implement.md
    outcome:
      summary:
        type: string
        required: true
    transitions:
      - to: review
  review:
    instruction: steps/review.md
    outcome:
      verdict:
        type: enum
        values: [pass, fail]
        required: true
      findings:
        type: string
    transitions:
      - when: { verdict: fail }
        to: implement
      - when: { verdict: pass }
        to: finish
  finish:
    instruction: steps/finish.md
